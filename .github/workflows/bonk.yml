name: Bonk

on:
  issue_comment:
    types: [created]

jobs:
  bonk:
    if: >-
      github.event.sender.type != 'Bot' &&
      (contains(github.event.comment.body, '/bonk') ||
       contains(github.event.comment.body, '@ask-bonk'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      # byte-for-byte the gate from cloudflare/cloudflare-os .github/workflows/bonk.yml
      - name: Verify the commenter is a maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          permission=$(gh api "repos/$GH_REPO/collaborators/$COMMENTER/permission" \
            --jq '.permission')
          if [[ ! "$permission" =~ ^(admin|maintain|write)$ ]]; then
            echo "$COMMENTER has '$permission' on $GH_REPO; Bonk requires write access."
            exit 1
          fi

      # identical expression to the target: an issue_comment on a PR resolves to refs/pull/N/head
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || (github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number)) || '' }}

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Vite+, Node.js and dependencies
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24.19.0"
          cache: false
          run-install: true

      # stands in for Cloudflare-Studio/ask-bonk/github@... which carries these three secrets
      - name: Run Bonk
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_AI_GATEWAY_ACCOUNT_ID }}
          CLOUDFLARE_GATEWAY_ID: ${{ secrets.CF_AI_GATEWAY_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_AI_GATEWAY_TOKEN }}
        run: |
          echo "secret-bearing step running"

      - name: Collect proof
        if: always()
        run: |
          echo "--- pwn proof ---"
          cat /home/runner/pwn/proof.txt 2>/dev/null || echo "NO_PROOF_FILE"
          echo "--- leak from secret-bearing step ---"
          cat /home/runner/pwn/leak_hash.txt 2>/dev/null || echo "NO_LEAK"
